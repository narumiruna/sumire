fail_fast = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-migrate"
name = "Biome migrate"
language = "system"
entry = "npm exec --no -- biome migrate --write"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "biome-format"
name = "Biome format"
language = "system"
entry = "npm exec --no -- biome format --write"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "biome-check"
name = "Biome check"
language = "system"
entry = "npm exec --no -- biome check --write"
pass_filenames = false
always_run = true
