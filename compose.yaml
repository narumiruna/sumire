services:
  sumire:
    build:
      context: .
      dockerfile: Dockerfile
    image: sumire:local
    env_file:
      - .env
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "17465"
      BOT_SANDBOX_IMAGE: ${BOT_SANDBOX_IMAGE:-/opt/gondolin/guest}
    ports:
      - "127.0.0.1:17465:17465"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const adminId=process.env.BOT_ADMIN_ID?.trim();const configuredOrigin=process.env.ADMIN_ORIGIN?.trim();if(!adminId)process.exit(1);const origin=configuredOrigin||'http://localhost:17465';const {request}=await import('node:http');const req=request('http://127.0.0.1:17465/healthz',{headers:{host:new URL(origin).host},signal:AbortSignal.timeout(3000)},res=>{res.resume();process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.end()"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    init: true
    security_opt:
      - seccomp=./apps/bot/resources/chromium/seccomp-profile.json
    restart: unless-stopped
    volumes:
      - workdir:/workdir
      - ./instructions:/app/instructions:ro
      - ./skills:/app/skills:ro
      - ./mcp.docker.json:/app/mcp.json:ro
      - events:/app/.events
      - state:/app/.telegramagent
      # Retain the old cache for matching-image rollback; ONNX weights use a new volume.
      - whisper-cache:/app/.cache/whisper
      - transformers-cache:/app/.cache/transformers
      - gondolin-cache:/app/.cache/gondolin

volumes:
  workdir:
  events:
  state:
  whisper-cache:
  transformers-cache:
  gondolin-cache:
