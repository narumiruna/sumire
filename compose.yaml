services:
  sumire:
    build:
      context: .
      dockerfile: Dockerfile
    image: sumire:local
    env_file:
      - .env
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "17465"
    ports:
      - "127.0.0.1:17465:17465"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const adminId=process.env.BOT_ADMIN_ID?.trim();const configuredOrigin=process.env.ADMIN_ORIGIN?.trim();if(!adminId&&!configuredOrigin)process.exit(0);const origin=configuredOrigin||'http://localhost:17465';const r=await fetch('http://127.0.0.1:17465/healthz',{headers:{host:new URL(origin).host},signal:AbortSignal.timeout(3000)});process.exit(r.ok?0:1)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    init: true
    security_opt:
      - seccomp=./apps/bot/resources/chromium/seccomp-profile.json
    restart: unless-stopped
    volumes:
      - workdir:/workdir
      - ./instructions:/app/instructions:ro
      - ./skills:/app/skills:ro
      - ./mcp.docker.json:/app/mcp.json:ro
      - events:/app/.events
      - state:/app/.telegramagent
      - whisper-cache:/app/.cache/whisper

volumes:
  workdir:
  events:
  state:
  whisper-cache:
