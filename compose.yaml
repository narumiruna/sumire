services:
  sumire:
    build:
      context: .
      dockerfile: Dockerfile
    image: sumire:local
    env_file:
      - .env
    init: true
    restart: unless-stopped
    volumes:
      - ./skills:/app/skills:ro
      - events:/app/.events
      - state:/app/.telegramagent
      - ./SOUL.md:/app/SOUL.md:ro

volumes:
  events:
  state:
