services:
  mcp-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: sumire:mcp-smoke
    init: true
    environment:
      - FIRECRAWL_API_KEY
    volumes:
      - ./mcp.json:/app/mcp.json:ro
      - ./apps/bot/scripts/check-mcp.mjs:/app/apps/bot/scripts/check-mcp.mjs:ro
    entrypoint: ["node", "/app/apps/bot/scripts/check-mcp.mjs"]
