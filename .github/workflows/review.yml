name: PR Review

on:
  pull_request_target:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pi-review-${{ github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: true

jobs:
  review:
    # Do not check out or execute pull request code in this trusted workflow.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: narumiruna/pi-action/review@v0.0.2
        with:
          pull-request: ${{ inputs.pull-request }}
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          provider: openai-codex
          model: gpt-6.1-sol
          thinking: medium
