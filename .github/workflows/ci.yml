name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/runtime-config/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "apps/bot/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-polymarket/**"
      - "packages/imagegen/**"
      - "packages/issues/**"
      - "packages/github-notifications/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/runtime-config/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "apps/bot/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-polymarket/**"
      - "packages/imagegen/**"
      - "packages/issues/**"
      - "packages/github-notifications/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check CI scripts
        run: npm exec -- biome check scripts/build-packages.mjs scripts/build-packages.test.mjs
      - name: Check CI build plan
        run: npm run test:ci
      - name: Build shared packages once
        run: npm run build:packages
      - name: Type check without rebuilding dependencies
        run: npm --ignore-scripts run typecheck --workspaces --if-present
      - name: Check generated Polymarket API
        run: npm run generate:check --workspace packages/pi-polymarket
      - name: Build applications without rebuilding dependencies
        run: npm --ignore-scripts run build --workspace apps/bot --workspace apps/web

  tests:
    name: tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bot-1
            workspace: apps/bot
            args: --shard=1/2
            audio: true
          - suite: bot-2
            workspace: apps/bot
            args: --shard=2/2
            audio: true
          - suite: web
            workspace: apps/web
            args: ""
            audio: false
          - suite: packages
            workspace: packages
            args: ""
            audio: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install audio test dependency
        if: matrix.audio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build shared packages once
        run: npm run build:packages
      - name: Test without rebuilding dependencies
        run: npm --ignore-scripts run test --workspace ${{ matrix.workspace }} -- ${{ matrix.args }}

  # Keep the existing required-check name; a failed/cancelled matrix must not pass it.
  typescript:
    name: typescript-checks
    if: always()
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks and test shards
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success

  container:
    name: container-build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check production application imports
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-application
          push: false
          cache-from: type=gha,scope=sumire-runtime-application
          cache-to: type=gha,mode=max,scope=sumire-runtime-application
