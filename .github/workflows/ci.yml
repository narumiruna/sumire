name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "apps/bot/**"
      - "apps/admin/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-miyu-cna-news/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "apps/bot/**"
      - "apps/admin/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-miyu-cna-news/**"

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
