name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/runtime-config/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "apps/bot/**"
      - "apps/admin/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-polymarket/**"
      - "packages/imagegen/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/runtime-config/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "apps/bot/**"
      - "apps/admin/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-polymarket/**"
      - "packages/imagegen/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  container:
    name: Container build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check production application imports
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-application
          push: false
          cache-from: type=gha,scope=sumire-runtime-application
          cache-to: type=gha,mode=max,scope=sumire-runtime-application
