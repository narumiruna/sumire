name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "apps/bot/**"
      - "apps/admin/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-polymarket/**"
      - "packages/imagegen/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "apps/bot/**"
      - "apps/admin/**"
      - "packages/contracts/**"
      - "packages/policy/**"
      - "package.json"
      - "package-lock.json"
      - "packages/login/**"
      - "packages/progress/**"
      - "packages/url-reader/**"
      - "packages/pi-url-reader/**"
      - "packages/pi-polymarket/**"
      - "packages/imagegen/**"

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test administration browser flows
        run: npm run test:browser --workspace @narumitw/sumire-admin
      - name: Capture Durable comparison
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node apps/admin/scripts/capture-durable-comparison.ts "$BASE_SHA" apps/admin/test-results/durable-comparison
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-browser-evidence
          path: apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 7
