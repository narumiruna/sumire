name: Deploy

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Prepare environment file
        run: |
          install -m 600 /dev/null .env
          {
            echo "BOT_TOKEN=${{secrets.BOT_TOKEN}}"
            echo "ENCRYPTION_KEY=${{secrets.ENCRYPTION_KEY}}"
            echo "BOT_ADMIN_ID=${{vars.BOT_ADMIN_ID}}"
            echo "ADMIN_ORIGIN=${{vars.ADMIN_ORIGIN}}"
            echo "FIRECRAWL_API_KEY=${{secrets.FIRECRAWL_API_KEY}}"
            echo "LOGFIRE_TOKEN=${{secrets.LOGFIRE_TOKEN}}"
            echo "MORSEL_API_KEY=${{secrets.MORSEL_API_KEY}}"
            echo "OTTER_TOKEN=${{secrets.OTTER_TOKEN}}"
          } >> .env

      - name: Deploy TypeScript bot with Docker Compose
        run: |
          docker compose build
          docker compose up -d --no-build --remove-orphans --force-recreate --wait --wait-timeout 180
          docker image prune -f

      - name: Remove environment file
        if: always()
        run: rm -f .env
