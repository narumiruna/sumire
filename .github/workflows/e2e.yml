name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test administration browser flows
        run: npm run test:browser --workspace @narumitw/sumire-admin
      - name: Capture Durable comparison
        env:
          BASE_SHA: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node apps/admin/scripts/capture-durable-comparison.ts "$BASE_SHA" apps/admin/test-results/durable-comparison
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: admin-browser-evidence
          path: apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 7
