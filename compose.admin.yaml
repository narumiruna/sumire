# Use behind an existing HTTPS reverse proxy on the Docker host.
services:
  sumire:
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "17465"
    ports:
      - "127.0.0.1:17465:17465"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const r=await fetch('http://127.0.0.1:17465/healthz',{headers:{host:new URL(process.env.ADMIN_ORIGIN).host},signal:AbortSignal.timeout(3000)});process.exit(r.ok?0:1)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
