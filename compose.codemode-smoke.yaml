# Isolated production-runtime smoke: no .env, credentials, polling, or state volumes.
services:
  sumire:
    build:
      context: .
      dockerfile: Dockerfile
    image: sumire:codemode-smoke
    platform: linux/amd64
    init: true
    network_mode: none
    entrypoint: ["node", "/tmp/codemode-smoke.mjs"]
    environment:
      SUMIRE_APP_ROOT: /app/apps/bot
      SUMIRE_SMOKE_PRODUCTION: "true"
    volumes:
      - ./apps/bot/tests/fixtures/codemode-smoke.mjs:/tmp/codemode-smoke.mjs:ro
